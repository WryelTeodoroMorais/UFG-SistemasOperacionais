[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-ml"
version = "0.1.0"
description = "Planejamento heurístico e execução isolada de scripts Python"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4,<2", "numpy>=1.26,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "reportlab>=4.4,<5"]

[project.scripts]
sentinela = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "features", "policy", "recommendation", "sandbox", "supervisor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
