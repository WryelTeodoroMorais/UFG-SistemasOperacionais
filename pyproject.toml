[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-ml"
version = "0.1.0"
description = "Sandbox Linux com recomendação supervisionada de recursos e capacidades"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4,<2", "numpy>=1.26,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "reportlab>=4.4,<5"]

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
